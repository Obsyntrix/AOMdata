name: Recover archived legacy bestiary pages

on:
  push:
    paths:
      - '.github/workflows/harvest-wayback-monsters.yml'
      - 'tools/harvest_wayback_areas.py'
      - 'tools/harvest_wayback_monsters.py'
      - 'tools/parse_historical_monster_page.py'
      - 'tools/build_bestiary_indexes.py'
      - 'tools/audit_bestiary.py'
      - 'tools/capture_bestiary_alphabetic.py'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest recovery code should touch the generated archive layer. Superseded
# recovery runs are cancelled instead of serially replaying stale crawler versions.
concurrency:
  group: legacy-bestiary-wayback-harvest
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preservation dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 PyYAML

      - name: Capture alphabetical historical bestiary view
        run: python tools/capture_bestiary_alphabetic.py

      - name: Recover missing original area pages from Wayback
        env:
          AOMDATA_WAYBACK_AREA_DELAY: '0.35'
          AOMDATA_WAYBACK_RETRIES: '4'
          AOMDATA_WAYBACK_LOOKUP_WORKERS: '4'
        run: python tools/harvest_wayback_areas.py

      - name: Recover original monster pages from Wayback
        env:
          AOMDATA_WAYBACK_DELAY: '0.35'
          AOMDATA_WAYBACK_RETRIES: '4'
          AOMDATA_WAYBACK_LOOKUP_WORKERS: '4'
          AOMDATA_WAYBACK_BATCH: '0'
        run: python tools/harvest_wayback_monsters.py

      - name: Rebuild complete query indexes
        run: python tools/build_bestiary_indexes.py

      - name: Audit bestiary graph
        run: python tools/audit_bestiary.py

      - name: Show recovery and audit summaries
        if: always()
        run: |
          if [ -f data/bestiary/wayback-area-report.yaml ]; then
            sed -n '1,100p' data/bestiary/wayback-area-report.yaml
          fi
          if [ -f data/bestiary/wayback-monster-report.yaml ]; then
            sed -n '1,100p' data/bestiary/wayback-monster-report.yaml
          fi
          if [ -f data/bestiary/audit.yaml ]; then
            sed -n '1,160p' data/bestiary/audit.yaml
          fi

      - name: Stage recovered source snapshots
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/bestiary
          if git diff --cached --quiet; then
            echo 'No preservation changes to stage.'
            echo 'RECOVERY_COMMIT=' >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Stage recovered Angels Wiki bestiary pages'
          echo "RECOVERY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish recovery onto latest main
        if: env.RECOVERY_COMMIT != ''
        env:
          AOMDATA_WAYBACK_AREA_DELAY: '0.35'
          AOMDATA_WAYBACK_RETRIES: '4'
          AOMDATA_WAYBACK_LOOKUP_WORKERS: '4'
        run: |
          # The archive lookup is the expensive part. Preserve those recovered monster
          # snapshots, then rebuild all cheap/generated layers on top of the newest main.
          # This avoids rebasing stale generated indexes when main moves during a long run.
          git fetch origin main
          git checkout -B preservation-publish origin/main

          git checkout "$RECOVERY_COMMIT" -- data/bestiary/site/monster-pages
          git checkout "$RECOVERY_COMMIT" -- data/bestiary/wayback-monster-report.yaml

          # Recompute the inexpensive layers against current main instead of carrying
          # stale generated files across the branch boundary.
          python tools/capture_bestiary_alphabetic.py
          python tools/harvest_wayback_areas.py
          python tools/build_bestiary_indexes.py
          python tools/audit_bestiary.py

          git add data/bestiary
          if git diff --cached --quiet; then
            echo 'No preservation changes to publish.'
            exit 0
          fi
          git commit -m 'Recover archived Angels Wiki bestiary pages'
          git push origin HEAD:main
