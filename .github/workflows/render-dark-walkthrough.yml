name: Render Dark faction walkthrough

on:
  push:
    paths:
      - 'tools/render_region_walkthrough.py'
      - 'data/quests/walkthrough-catalog/dark.yaml'
      - '.github/workflows/render-dark-walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Render Dark walkthrough
        run: python tools/render_region_walkthrough.py dark
      - name: Publish guide
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/quests/player-guides/dark.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render Dark faction quest walkthrough'
          git fetch origin main
          if ! git rebase -X theirs origin/main; then
            git rebase --abort
            exit 1
          fi
          git push origin HEAD:main
