name: Harvest current-client quest corroboration

on:
  push:
    paths:
      - 'tools/harvest_booklet_quest_evidence.py'
      - '.github/workflows/harvest-booklet-quest-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aomega-booklet-quest-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 PyYAML
      - name: Harvest current-client corroboration
        env:
          AOMDATA_BOOKLET_DELAY: '0.08'
          AOMDATA_BOOKLET_MAX_MAP_ID: '220'
          AOMDATA_BOOKLET_RETRIES: '3'
        run: python tools/harvest_booklet_quest_evidence.py
      - name: Show coverage
        if: always()
        run: |
          if [ -f data/quests/research/current-booklet/coverage.yaml ]; then
            sed -n '1,220p' data/quests/research/current-booklet/coverage.yaml
          fi
      - name: Publish corroboration evidence
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/quests/research/current-booklet
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Harvest current-client quest corroboration evidence'
          git fetch origin main
          if ! git rebase -X theirs origin/main; then
            git rebase --abort
            echo 'Unable to replay corroboration layer on latest main.'
            exit 1
          fi
          git push origin HEAD:main
