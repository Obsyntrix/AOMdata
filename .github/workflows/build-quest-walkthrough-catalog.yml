name: Build quest walkthrough catalog

on:
  push:
    paths:
      - 'data/quests/research/walkthrough-intake/**'
      - 'data/quests/research/legacy-guides/**'
      - 'data/quests/research/current-booklet/**'
      - 'data/quests/research/gap-corroboration.yaml'
      - 'data/quests/research/walkthrough-enrichments.yaml'
      - 'data/quests/areas/**'
      - 'data/quests/series/**'
      - 'tools/build_quest_walkthrough_catalog.py'
      - 'tools/sanitize_quest_walkthrough_catalog.py'
      - 'tools/repair_asmode_historical_links.py'
      - 'tools/repair_placeholder_walkthroughs.py'
      - 'tools/apply_walkthrough_enrichments.py'
      - 'tools/audit_walkthrough_catalog.py'
      - '.github/workflows/build-quest-walkthrough-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aomega-quest-walkthrough-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Build broad evidence catalog
        run: python tools/build_quest_walkthrough_catalog.py
      - name: Sanitize quest/page joins and apply explicit gap corroboration
        run: python tools/sanitize_quest_walkthrough_catalog.py
      - name: Recover Asmode dedicated pages hidden by row suffixes
        run: python tools/repair_asmode_historical_links.py
      - name: Reject placeholder walkthrough bodies
        run: python tools/repair_placeholder_walkthroughs.py
      - name: Apply researched walkthrough enrichments
        run: python tools/apply_walkthrough_enrichments.py
      - name: Audit final catalog
        run: python tools/audit_walkthrough_catalog.py
      - name: Show manifest and gap audit
        if: always()
        run: |
          if [ -f data/quests/walkthrough-catalog/manifest.yaml ]; then
            cat data/quests/walkthrough-catalog/manifest.yaml
          fi
          if [ -f data/quests/walkthrough-catalog/asmode-link-repair.yaml ]; then
            cat data/quests/walkthrough-catalog/asmode-link-repair.yaml
          fi
          if [ -f data/quests/walkthrough-catalog/placeholder-repair.yaml ]; then
            cat data/quests/walkthrough-catalog/placeholder-repair.yaml
          fi
          if [ -f data/quests/walkthrough-catalog/gaps.yaml ]; then
            sed -n '1,320p' data/quests/walkthrough-catalog/gaps.yaml
          fi
      - name: Publish catalog
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/quests/walkthrough-catalog
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build sanitized enriched six-region quest walkthrough catalog'
          git fetch origin main
          if ! git rebase -X theirs origin/main; then
            git rebase --abort
            echo 'Unable to replay walkthrough catalog on latest main.'
            exit 1
          fi
          git push origin HEAD:main
