name: Build quest walkthrough catalog

on:
  push:
    paths:
      - 'data/quests/research/walkthrough-intake/**'
      - 'data/quests/research/legacy-guides/**'
      - 'data/quests/research/current-booklet/**'
      - 'data/quests/areas/**'
      - 'data/quests/series/**'
      - 'tools/build_quest_walkthrough_catalog.py'
      - '.github/workflows/build-quest-walkthrough-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aomega-quest-walkthrough-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Build catalog
        run: python tools/build_quest_walkthrough_catalog.py
      - name: Show manifest
        if: always()
        run: |
          if [ -f data/quests/walkthrough-catalog/manifest.yaml ]; then
            cat data/quests/walkthrough-catalog/manifest.yaml
          fi
      - name: Publish catalog
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/quests/walkthrough-catalog
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build six-region quest walkthrough catalog'
          git fetch origin main
          if ! git rebase -X theirs origin/main; then
            git rebase --abort
            echo 'Unable to replay walkthrough catalog on latest main.'
            exit 1
          fi
          git push origin HEAD:main
