name: Harvest legacy bestiary

# Preservation harvester for the legacy Angels Wiki mirror.
# Network crawling is intentionally manual-only so index/audit maintenance cannot
# launch a competing harvest while another provenance source is being recovered.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 PyYAML

      - name: Resume preserved Angels Wiki bestiary crawl
        env:
          AOMDATA_RESUME_DELAY: '0.75'
          AOMDATA_RESUME_RETRIES: '8'
          AOMDATA_RESUME_BACKOFF: '5'
          AOMDATA_RESUME_MAX_BACKOFF: '120'
        run: python tools/resume_legacy_bestiary.py

      - name: Rebuild bestiary indexes
        run: python tools/build_bestiary_indexes.py

      - name: Audit bestiary graph
        run: python tools/audit_bestiary.py

      - name: Show crawl report
        if: always()
        run: |
          if [ -f data/bestiary/crawl-report.yaml ]; then
            cat data/bestiary/crawl-report.yaml
          fi

      - name: Commit harvested preservation data
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/bestiary
          if git diff --cached --quiet; then
            echo 'No bestiary changes to commit.'
            exit 0
          fi
          git commit -m 'Resume legacy Angels Wiki bestiary harvest'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
