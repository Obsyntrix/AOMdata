name: Harvest legacy bestiary

on:
  push:
    paths:
      - '.github/workflows/harvest-legacy-bestiary.yml'
      - 'tools/crawl_legacy_bestiary.py'
      - 'tools/build_bestiary_indexes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 PyYAML

      - name: Crawl preserved Angels Wiki bestiary
        env:
          AOMDATA_CRAWL_DELAY: '0.05'
          AOMDATA_CRAWL_MONSTER_PAGES: '1'
        run: python tools/crawl_legacy_bestiary.py

      - name: Rebuild bestiary indexes
        run: python tools/build_bestiary_indexes.py

      - name: Show crawl report
        if: always()
        run: |
          if [ -f data/bestiary/crawl-report.yaml ]; then
            cat data/bestiary/crawl-report.yaml
          fi

      - name: Commit harvested preservation data
        run: |
          git config user.name 'AOmega Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/bestiary
          if git diff --cached --quiet; then
            echo 'No bestiary changes to commit.'
            exit 0
          fi
          git commit -m 'Harvest legacy Angels Wiki bestiary data'
          git push
