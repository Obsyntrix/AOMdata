- section: Description
  text_raw: Memory Cave is the home of forgotten lives. It is the respected resting place of ended bodies and the place where memory settles in dust as sorrow and joy. Walk through the
    gravestones and uncover things hidden by time. Pay your respects in the gift shop and visit with the Executive Chief. His tale of love will inspire a heart beat in this silent realm
    amid the level 27 to 35 creatures. The Porky Men can be smelled a mile away, it’s best not to touch them, they‘re vile.
