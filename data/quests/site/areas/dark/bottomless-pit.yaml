  text_raw: Shadowy Path , Degula Maze , Vine Front
- section: Description
  text_raw: What secrets of the shadow origins lay in the fathomless depth of the Bottomless Pit? The members of the research center have made it their task to find out. While you’re
    here you might as well visit and see what help you can give these researchers. Who knows what secrets they may yet uncover in the sealed temple, or the unknown depths of the Pit?
    Be mindful of the level 18 to 26 creatures here that are standing in the way of the researchers and their quest for knowledge. These monsters like to throw things. Duck!
