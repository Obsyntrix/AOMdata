- section: Degula Maze
  text_raw: 'Information

    Map'
- section: 'Adjacent Areas:'
  text_raw: Bottomless Pit , Memory Cave
- section: Description
  text_raw: Pumpkins are all the rage in Degula Maze, but it would seem not all the leeches like what’s on the new menu. You may wish to talk to Duke Degula about it. His level 24 to
    32 friends and pet bats might make an impression on you. Perhaps, since it is getting late down here in this maze, you will want to stay and join them…for dinner. As you pass through,
    keep a keen eye on that suspicious gardener, Asmode. His plans are beyond the desires of these leeches.
