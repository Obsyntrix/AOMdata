- section: Description
  text_raw: An underground forest of fungus? Welcome to Fungus Forest South. The caverns are filled with the haunted cries of the local ghosts levelling from 15 to 23. Watch out for
    the annoying Imps who will mob at any chance they can get! Poor Miss Diana, trying to teach these mischievous creatures all on her own. There is a certain eerie calm around the Nazarite
    to the south here, but his calm can’t subdue the stubborn learning of the mournful apparitions in the dark.
