  text_raw: Fungus Forest South , Gebuer Vale
- section: Description
  text_raw: Another forest of savoury fungus in this land under the mountains. Only in Fungus Forest North, the fungus tends to bite back. The creatures here range from level 30 to 40
    and like to give chase. Visit with the Project Leader to see how the Railway work is progressing. You can try to help Big Mouth Anglu - if you can stand to listen to him.
