- section: Description
  text_raw: Mysterious Garden is a beautiful maze of intrigue. Don’t be afraid to speak with the ghosts or to investigate the corners and dead-ends. There are secrets and love to be
    found here. Just be careful not to smell the roses or you may be kissed to death. Love and loss linger here entwined amid the level 27 to 35 creatures.
