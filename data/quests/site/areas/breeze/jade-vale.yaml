- section: Jade Vale
  text_raw: 'Information

    Map'
- section: Description
  text_raw: Jade Vale is a scenic place that has been used for training, and is now used by the Magic Eye as a hide-out. Keep an eye out for these aggressive robbers or they will steal
    your life. Though, they seem to be very interested in that relic up north. Be sure to check in on the fishing industry, and the archaeology study of the area. There’s a sly fellow
    named Asmode by the entrance that likes his women and has a secret agenda.
