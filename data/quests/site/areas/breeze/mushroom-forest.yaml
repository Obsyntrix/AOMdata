- section: Description
  text_raw: Mushroom Forest, home of the prize winning Golden Matsuake, and to its biggest culinary following to Tailmen. You can play among the giant mushrooms here, just be careful
    not to provoke the Purple ones, they are quite poisonous. There is lots to eat here in the level 15 to 20 monsters if you‘re desperate, just ask Robber Hork!
