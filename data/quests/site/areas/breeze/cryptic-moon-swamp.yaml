- section: Description
  text_raw: The dank and dark Cryptic Moon Swamp is filled with secrets whispering through the reeds. Watch your step on the rickety boards over the bog as well as the elves that like
    to push people in. If you fall into the swamp you will sink into the lush weeds and never be seen again. Perhaps the ghost of your voice will join the chorus of the marsh frogs.
    The spirits of the ancestors keep vigil from these old trees amid the level 18 to 26 creatures. Do they know the secret of the Sage and the portal to the Faded Jungle?
