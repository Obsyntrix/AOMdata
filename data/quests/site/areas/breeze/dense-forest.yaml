- section: Description
  text_raw: Welcome to Dense Forest, a lovely wooded retreat with passive creatures roaming about in the level 8 to 17 category just outside of the Breeze Woods capital. Enjoy the relaxing
    forest atmosphere or work on your skills and farming here. Make sure to have a chat with the local herbalist and be mindful of the Flame Lily — it has a nasty temper.
