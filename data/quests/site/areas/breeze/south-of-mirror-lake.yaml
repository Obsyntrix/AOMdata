- section: Description
  text_raw: South of Mirror Lake, once a fishing village, now rampant with crazy clowns. Make certain not to hide behind a tree or it might prove to be your last great idea. The creatures
    here are level 35 to 45 and quite keen to be a problem. If you’re feeling more adventurous, go visit the nightmare cave in the north-west.
