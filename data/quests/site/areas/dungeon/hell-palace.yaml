- section: Description
  text_raw: Although the hall of Hell Palace is so rotted out it is literally falling apart in some places, you can still feel the aura of pain and death persisting. Under the main path
    there is a locked door. The Angel Pickets tried every means to open it but failed. The magical power inside is so powerful that it even comes out of the door sometimes, so we know
    the secrets hidden in this relic are still undisturbed.
