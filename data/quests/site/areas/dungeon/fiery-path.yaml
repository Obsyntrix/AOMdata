- section: Description
  text_raw: Hot…very hot, that is the first feeling when you arrive here. Endless sweat and sweltering air will cause you to start shedding gear as soon as possible. Around the crimson
    lava paths, beside the huge rocks and sharp lumps, all you can see is a boiling, underground lava lake.
