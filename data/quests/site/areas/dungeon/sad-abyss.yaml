  text_raw: Dragon Graveyard , Fiery Path
- section: Description
  text_raw: The sad and thorny calls echo around the dark gorge anytime and anywhere. Some people said it was formed by the haunting wind, but also some people said if you go deep enough
    into the gorge, the voice becomes louder and more grievous, so people rarely venture into the depths of the Sad Abyss.
