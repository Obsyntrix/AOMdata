- section: Description
  text_raw: Wishing Tear is named such because of the tear shaped oasis in its midst. What could be more precious in a desert than clean water? Unfortunately, it would seem some of these
    level 9 to 17 monsters wish to muck up this wondrous treasure. The local scientists welcome aide. Be sure to check out some of the merchant’s wares and sample the local lizard meat
    while passing by.
