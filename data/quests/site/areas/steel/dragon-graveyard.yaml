- section: Description
  text_raw: The famed Dragon Graveyard, no living dragons here, just their remains. The creatures that hinder the travelers here range in level from 40 to 50. This land is perfect for
    levelling and ranking. That poor Mike, I wish he’d stop falling asleep and losing his stones. The entrance to the Dungeon also awaits among the bleached bones of this sacred spot.
