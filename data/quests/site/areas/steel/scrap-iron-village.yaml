  text_raw: Wishing Tear , Megalith Plain
- section: Description
  text_raw: Looking from a distance and can’t tell if this area in the rolling desert sands is a heap of scrap iron or a village? Well it‘s both, welcome to Scrap Iron Village! Enjoy
    a discussion with the famed genius Edison. But, be mindful of the level 15 to 23 robots, who all seem to be running amuck. It may also be a wise idea to avoid the radioactive slarms
    for more sanitary reasons. They’ve been playing in the sewers again…
