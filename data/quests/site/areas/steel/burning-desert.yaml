- section: Description
  text_raw: If you love Mummies (and who doesn’t?), then the rolling dunes and scorching heat of Burning Desert is for you. Wander in awe of the ancient mummified creatures here from
    level 24 to 29 and take a rest by General Alexander and listen to Dinot’s tale of woe. The stench of he mummies tends to bring out the hungry toxic spiders in the noon day sun, by
    wary of their bite! Also, you may want to keep an eye on that sly fellow, Asmode, by the southern portal…he’s up to something sinister.
