- section: Cactus Plain
  text_raw: 'Information

    Map'
- section: Description
  text_raw: Cactus Plain is full of tasty cactus fruit and the annoying monkeys who steal it. See what missions the Chief can send you on to deal with these level 18 to 26 creatures.
    There might be a few lost treasures along the way including whispers of the Gebuers' sealed Decadence City. Also, be certain to acknowledge the Spy Angel while you’re here.
