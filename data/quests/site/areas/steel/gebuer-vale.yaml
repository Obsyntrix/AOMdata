- section: Description
  text_raw: Geubers…I mean Gebuers, everywhere! Gebuer Vale is crawling with these level 27 to 35 guys. They don’t seem to mind the smell of the Rotten Birds either. There are a lot
    of shops here to browse in and upgrade your skills. Explore the scenery and you just may find something interesting to investigate.
