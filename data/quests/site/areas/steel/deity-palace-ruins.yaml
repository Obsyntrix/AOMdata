- section: Description
  text_raw: Deity Palace Ruins must have been a grand building before it was destroyed. The sheer mass! The splendorous gardens that now infringe on what was once beautiful architecture.
    Now the Ruins are haunted by creatures levelling 50 to 63. The elves are not related to your pets, they angrily scour the shadows of the ruins for stragglers. The Fane also dwells
    here, carrying with them the much sought after PK5 drop. You can be sure to camp overnight here with many a friend.
