- section: Description
  text_raw: Located in the middle and southern part of Puqi Island, it is a new base built by Iron Castle. It is divided into 5 parts, including four special parts for the four factions
    around the base and a part for commerce and sightseeing in the middle. Many Angels come from great distances to gather here and prepare for their underwater exploration.
