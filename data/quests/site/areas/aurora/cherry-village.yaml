- section: Cherry Village
  text_raw: 'Information

    Map'
- section: Description
  text_raw: Cherry Village is a warm and friendly place to visit. You can admire the beach scenery as you stroll through the medium level NPC shops and run with the level 24 to 35 creatures.
    There is much to do in this serene little village. You can visit with Cherry’s Leader to find out the latest happenings. If you’re the adventurous sort, then perhaps you’d like to
    join up to the Cherry Militia with Robust Yady. If the scholarly approach is more up your alley, then make sure to visit Scholar Nilsson and ask about his research. Maybe you could
    even try to ease the pain of saddest person in Cherry Village, the Countrylady.
