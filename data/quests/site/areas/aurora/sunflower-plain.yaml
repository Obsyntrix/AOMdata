  text_raw: 'Information

    Map'
- section: 'Adjacent Areas:'
  text_raw: Spike Farm , Crashing Hillock , South of Mirror Lake , Training Area
- section: Description
  text_raw: Welcome to Sunflower Plain! Where Sheep are the maestros, and where pumpkins are up to no good. This fruitful landscape is dominated by the manor of Sir Douglas and a perfect
    spot to take a leisurely stroll. If you’re lucky, Sheep Beethoven may even serenade you to a concert amid the level 12 to 23 creatures. Then again, you might be better off avoiding
    such a performance.
