- section: Thunder Ruins
  text_raw: 'Information

    Map'
- section: 'Adjacent Areas:'
  text_raw: Crashing Hillock , Thorn Wasteland , Mysterious Wetland
- section: Description
  text_raw: Once a thriving community, all that remains in Thunder Ruins now are the scorch marks. The bellows of the haunted souls here slicing through the silence like thunder. As
    you travel carefully through this haunted landscape, be sure to visit with the few strangers that dare come here. But watch your step. This land is over-run by the level 45 to 55
    fallen angels and demons of the Evil Lyceum.
- section: Note
  text_raw: 'Bosses: Black Fire Harr and Fallen Archangel have +- 3% to drop Brute''s Egg'
