- section: Description
  text_raw: Beware of the big bad wolves in the shadow’s of the rocks of Crashing Hillock. These aggressive level 30 to 40 canines have run of this land. With their sharp teeth and fine
    fur they are sought after by the exploring members - the very people the wolves are such a menace to. Just ask the Director or the Security Officer about it.
