- section: 'Adjacent Areas:'
  text_raw: Dawn Harbor , Cherry Village
- section: Description
  text_raw: Riprap Coast is one of the main honeymoon destinations in Eden. The breathtaking beauty of its sun-kissed beaches and clear ocean waters is a sight to behold for certain!
    Lovers are often spotted hand in hand here gazing out to the glistening waves and Atlantis beyond. Sadly, the level 24 to 29 Pirates are roaming the shores looking for treasure and
    a pretty lass to capture. So, watch outI Ladies you should also avoid that scurvy fellow Asmode, he’s eyeing more than your purse.
