- section: Thorn Wasteland
  text_raw: 'Information

    Map'
- section: 'Adjacent Areas:'
  text_raw: Thunder Ruins , Dragon Graveyard , North of Mirror Lake , Foggy Forest
- section: Description
  text_raw: Thorn Wasteland is as its name suggests. A land with little growth but for the maze of hungry thorns through it. The sun is hot here and the nights are cold. Try not to get
    stuck dealing with the level 45 to 55 locals as they are not friendly. Whatever you do, don’t go into a cave for shelter! There seems to be a poor Lady in distress over a handbag,
    and a pioneer in need of assistance. If you are feeling truly brave, you should try to engage Crazy Steve in a bit of friendly competition.
