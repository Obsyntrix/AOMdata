- section: Description
  text_raw: Spike Farm is owned by the Spike Farmer but ruled by the level 6 to 12 creatures that cause this Farmer grief. The country air is good for the soul and the warm, hardworking
    farmer folk here are a friendly bunch. Take your time as you stroll through the fields and watch the crops grow…if you can stop the mice from eating them long enough!
