    Map'
- section: 'Adjacent Areas:'
  text_raw: Spike Farm , Riprap Coast , Port Cherube
- section: Description
  text_raw: Dawn Harbor is the heartland of the fishing industry in Aurora. Stroll along the boardwalk and sample the Chef’s fine cuisine. Enjoy a refreshing drink from the Barkeeper
    and maybe you can help out the Fishing Leader with his Pirate problems. Those scallywags are everywhere these days. As you enjoy the salty air of the ocean and the busy harbor life,
    be mindful of the level 18 to 26 creatures that run about. Especially those filthy mice!
