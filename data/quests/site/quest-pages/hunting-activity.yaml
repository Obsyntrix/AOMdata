- section: Hunting Activity
  text_raw: Home » Areas » Thorn Wasteland » Hunting Activity
- section: Summary
  text_raw: Crazy Steve is a nutbar and asks you to have a killing competition with him. You will need to kill monsters in Thorn Wasteland and Thunder Ruins for this quest. That is,
    if you're up for the competition.
- section: Walkthrough
  text_raw: Step 1 Talk to Crazy Steve (142,121). Step 2 Defeat Fire Barft and collect 10 Barft's Eye. Step 3 Defeat Savage Priests and collect 10 Cursed Masks. Step 4 In Thunder Ruins
    defeat Fallen Angels and collect 10 Degenerate Angel's Feathers. Step 5 In Thunder Ruins defeat Burning Monsters and collect 10 Fire Demon's Spears. Step 6 Return to Thorn Wasteland
    . Step 7 Meet up with Crazy Steve and show him your items.
