- section: Young Age
  text_raw: Home » Areas » Memory Cave » Young Age
- section: Summary
  text_raw: The Executive Chief and his wife each made a box to open up 30 years ago when they were first wed. Unfortunately, while the Executive Chief was away training for his new
    job, his wife began ill and she died those many years ago. The time is ready for him to open the box, and he asks you to go retrieve it for him in Degula Maze .
- section: Walkthrough
  text_raw: Step 1 Learn of the Executive Chief's great love by talking with him (301,171). Step 2 Go to Degula Maze Step 3 Dig up the Time Box (145,94 - it's by the tree in the courtyard
    in front of the Degula Duke's). Step 4 Return the Time Box back to the Executive Chief in Memory Cave .
