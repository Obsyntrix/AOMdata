- section: Wife S Present
  text_raw: Home » Areas » Memory Cave » Wife's Present
- section: Summary
  text_raw: From the Time Box the Executive Chief learns that his wife burried him a present in the graveyards of Memory Cave , he trusts you to go get it for him.
- section: Walkthrough
  text_raw: Step 1 Talk to the Executive Chief's (301,171). Step 2 Go to (201,41) to dig up the present left to him by his wife. You discover that it has already been dug up! Step 3
    When you click on the mound, the boss Rotten Wanda in summoned. You must defeat it to obtain the present. Step 4 Take the gift to the Executive Chief.
