- section: Karter S Planning Book
  text_raw: Home » Areas » Riprap Coast » Karter's Planning Book
- section: Summary
  text_raw: Karter believes his friend Bonny is a coward for not wanting to fight the pirates. But, Bonny had a plan he wished to propose to the Fish Labor Union. Unfortunately, it was
    lost. Maybe you can find Bonnie's Itemosal and show it to Karter to mend their friendship.
- section: Walkthrough
  text_raw: Step 1 You find a Proposal by clicking on the pile of books (189,36) by the pick-nic table in Riprap Coast . Step 2 Take the proposal to Sailor Bonny (257,111) in Dawn Harbor
    , he will give you the quest. Step 3 Then show the proposal to Sailor Karter (269,76) in Dawn Harbor .
