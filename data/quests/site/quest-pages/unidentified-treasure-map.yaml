- section: Walkthrough
  text_raw: Step 1 Descover the paper while killing Iron Crabs . Step 2 Visit an Antique Expert in one of the four cities. Aurora City Antique Expert (130, 77) won't be sure of what
    it is.((It doesn't matter what order this is done in, but I'll list them this way.)) Step 3 Go to the next City and ask the Antique Expert (245, 149) in Breeze Woods, who will still
    be uncertain of the paper. Step 4 Continue on to the third City, Iron Castle and the Antique Expert () will still not be completely certain. Step 5 Go to the last city, Dark City
    and the Antique Expert () will know what it is you have, and offer to buy it.
