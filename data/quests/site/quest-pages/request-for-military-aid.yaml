- section: Request For Military Aid
  text_raw: Home » Areas » Dawn Harbor » Request for Military Aid
- section: Summary
  text_raw: The Fishing Leader asks you to take a message to the Deputy Colonel in Aurora City asking for help in dealing with the pirates.
- section: Walkthrough
  text_raw: Step 1 Speak to the Fishing Leader (152,156) and ask about the Riprap Pirates . He will give you the Chairman's Letter . Step 2 Take the letter to Aurora City . Step 3 Give
    it to the Deputy Colonel (103,85). Step 4 Go back to Dawn Harbor . Step 5 Tell the Fishing Leader that he won't be getting help yet, things must be approved by the King first.
