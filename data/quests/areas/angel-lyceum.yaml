  - id: angel-lyceum-top-student-training
    name: Top Student Training
    repeatable: false
    category: single
    giver: {npc: Michael, area: Angel Lyceum, coordinates: [215, 110]}
    requirements:
      credit_hours_minimum: 15
      must_not_have_completed: [angel-lyceum-accumulation-schedule-of-students-grades]
    rewards:
      experience: 1000
      gold: 300
      choose_one_item: [Top Student Dagger, Top Student Axe, Top Student Spear, Top Student Staff, Top Student Bow, Top Student Sharp Knife]
    objectives:
      - {type: collect_drop, target: Little Gebuer, item: Human Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: collect_drop, target: Wildwolf, item: Beast Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: collect_drop, target: Headless Armor, item: Energy Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: collect_drop, target: Tree Spirit, item: Plant Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: collect_drop, target: Brute Priest, item: Deathless Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: collect_drop, target: Goat Demon, item: Demon Core, count: 1, area: Training Palace, drop_rate: null}
      - {type: interact, target: Altar, area: Training Palace, coordinates: [165, 86], action: Place the six different Cores on the Altar}
      - {type: kill, target: Qiuaner, count: 1, area: Training Palace}
      - {type: obtain, item: Guards Necklace, count: 1}
      - {type: talk, target: Michael, area: Angel Lyceum, coordinates: [215, 110]}
    walkthrough:
      - "Earn at least 15 credit hours before completing Accumulation schedule of students' grades, then speak with Michael at (215,110)."
      - Travel to Training Palace through East Playground or West Playground.
      - Kill Little Gebuer, Wildwolf, Headless Armor, Tree Spirit, Brute Priest, and Goat Demon until you have their six corresponding cores.
      - Interact with the altar at (165,86) and place all six cores to summon Qiuaner.
      - Defeat Qiuaner. Eligible party members on the quest receive the Guards Necklace.
      - Return the Guards Necklace to Michael and choose one reward weapon.
    notes:
      - The quest cannot be accepted after graduating, but the dedicated page says it can still be completed after graduation if accepted beforehand.
      - The dedicated page recommends a party or help from a level 25+ character for Qiuaner.
      - Core drops are explicitly described as non-guaranteed, but no percentages are documented. Drop rates therefore remain null.
    related_entities:
      areas: [Angel Lyceum, East Playground, West Playground, Training Palace]
      npcs: [Michael]
      monsters: [Little Gebuer, Wildwolf, Headless Armor, Tree Spirit, Brute Priest, Goat Demon, Qiuaner]
      items: [Human Core, Beast Core, Energy Core, Plant Core, Deathless Core, Demon Core, Guards Necklace]
    verification: {status: web_documented, client_confirmation: pending, conflicts: []}
    source_refs: [area_page, top_student_training]
