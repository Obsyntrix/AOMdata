  - id: angel-lyceum-freshmans-signing-for-taking-courses
    name: "Freshman's Signing for taking courses"
    repeatable: false
    category: series
    series: {name: Angel Lyceum graduation, position: 2, total: 5, previous: angel-lyceum-registration-at-angels-tutor, next: angel-lyceum-accumulation-schedule-of-students-grades}
    giver: {npc: "Angels' Tutor", area: Angel Lyceum, coordinates: [179, 91]}
    requirements:
      prerequisite_quests: [angel-lyceum-registration-at-angels-tutor]
    rewards: {experience: 100, gold: 50}
    objectives:
      - {type: talk, target: Battle Professor, area: Angel Lyceum, coordinates: [227, 86]}
      - {type: talk, target: Magic Professor, area: Angel Lyceum, coordinates: [170, 116]}
      - {type: talk, target: Mine Professor, area: Angel Lyceum, coordinates: [190, 41]}
    walkthrough:
      - Complete Registration at Angels' Tutor.
      - Speak with the Battle Professor at (227,86).
      - Speak with the Magic Professor. See coordinate conflict below.
      - Speak with the Mine Professor at (190,41).
    notes:
      - The quest table prints the Magic Professor as (170,16), while the Important NPC table on the same page gives (170,116).
    verification:
      status: web_conflict
      client_confirmation: pending
      conflicts:
        - field: objectives.magic_professor.coordinates
          values: [[170, 16], [170, 116]]
          provisional_navigation_value: [170, 116]
          reason: The NPC table and quest short-description disagree.
    source_refs: [area_page]

  - id: angel-lyceum-accumulation-schedule-of-students-grades
    name: "Accumulation schedule of students' grades"
    repeatable: false
