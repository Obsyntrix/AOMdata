    rewards:
      items: [{name: null, note: Area page only says Item; identity not documented.}]
    objectives:
      - {type: earn_credit_hours, minimum: 5, method: Complete repeatable Angel Lyceum training quests}
    walkthrough:
      - Complete Freshman's Signing for taking courses.
      - Take repeatable training quests from the Battle, Magic, or Mine Professor.
      - Earn at least 5 credit hours.
      - Complete the grade-accumulation requirement with the beginner quest flow.
    notes:
      - Completing this quest closes the documented availability window for the Lyceum repeatable training quests.
    verification: {status: web_partial, client_confirmation: pending, conflicts: []}
    source_refs: [area_page]

