- region: dungeon
  area_id: underground-square
  id: underground-square-scattered-will
  name: Scattered Will
  source_class: historical_japanese_corroboration
  steps:
  - Speak with Purified Moppet at (39,19) in Underground Square.
  - Defeat 40 Flame Dolls.
  - Return to Purified Moppet to complete the repeatable quest.
  caveat: The English area page does not preserve the objective; the 40-Flame-Doll objective is supplied by the historical Japanese AngelLoveOnline wiki and remains pending AOmega target-client
    confirmation.
- region: atlantis
  area_id: dream-ocean
  id: dream-ocean-mermaid-s-tears
  name: Mermaid's Tears
  source_class: historical_japanese_plus_current_client_corroboration
  steps:
  - At level 80-85, speak with Crybaby Shin at (126,154) in Dream Ocean.
  - Go to the Bottle/Jug Mermaid area around (250,96) and obtain/break 30 mermaid bottles.
  - Return to Crybaby Shin at (126,154).
  - Speak with Crybaby Shin again to complete the repeatable quest.
  caveat: The historical English Dream Ocean page is unfinished. Objective/reward details are independently corroborated by the historical Japanese wiki and current client database;
    coordinates are current-client evidence pending AOmega target-client confirmation.
