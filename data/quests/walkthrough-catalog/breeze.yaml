- title_raw: A Will To Risk
  summary_raw: '"Gustav is badly injured and is awaiting your treatment. His fate is in your hands." -Quest Log'
  requirements_raw: Faction Lvl Rank Skill Quest - - - - -
  reward_raw: 'Exp. Credit Gold 30,000 300 12000 Items Choose one of: Item Name , Item Name'
  walkthrough_steps:
  - Go to Breeze Woods to meet Doctor Cliss
  - 'Collect these items: Fire Core of Imp Elf - 4 Anti-inflammatory Gel of Rock Slarm - 6 Cooling Oil of Terra Lampman - 1'
  - Return to Breeze Woods and ask Doctor Cliss to make the medicine. You will be required to pay 5000 Gold.
  - Bring the medicine to Gustav . Gustav will die. You will then you need to go to Angel Lyceum
  - Find House Pickets to stop Gustav soul
