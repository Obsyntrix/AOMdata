  walkthrough:
    source_class: historical_dedicated_quest_page
    steps:
    - 'First Step

      You begin it by talking to Villiersas in Palm Base (Atlantis) -Then head to Wave Harbor and kill 45 Angel Fish , 75 Stab Jellyfish , 60 Whelk Mage and 60 Whelk Swordsman . -Return & talk to Villiersas

      Second Step

      -Walk to the dungeon.( located in Dragon Graveyard) -Go to the Hell Palace and talk to Lorin . -Kill tonnes of Riddle Bishop until you have the required 80 black crystals. -Talk to Lorin

      Third Step

      -Go to the Waterfall Camp ( Jungle) -Talk to Stewart and kill numerous Earth Fairy until you have 10 elite cores. Tip : Put the fruits droped by them into your ab at 100% to auto open and save your
      bag space -Once you''re done with that, go back to Villiersas and get ready to boss hunt.

      Last Step

      -You will need to kill the following bosses : Hermit Hezon - Found in the Waterfall Camp (Jungle) Leech Mrs. Dorsa - Found in the Secret Den (Jungle) Purple Scorpion Issac - Found in Crescent Valley
      (Desert) Destroyer Wesley -Found in the Desert Racetrack (Desert) Sword Jellyfish - Found in Wave Harbor (Atlantis) -After you''ve killed all 5 of the bosses and gotten the stones droped from them(
      100% chance of droping the stones) Return to Palm Base and talk to Villiersas and get your reward.'
