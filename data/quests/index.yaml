coverage_notes:
  - Riprap Coast's primary area page was not retrievable; its known local quests are preserved as a lower-confidence reconstruction from cross-references and a 2012 guide.
  - Crashing Hillock and Thunder Ruins remain unresolved for local quest tables; the directory marks their quest counts unknown.
  - North of Mirror Lake is known to have five repeatables, but its complete area table has not yet been recovered in a form sufficient for canonical entry.
  - Area-level documentation being absent or templated does not mean the game contains no quests there.
  - Retrieval mirror pages from aowiki.uk are used only where they preserve the original Angels Wikidot area/quest text in a reliably fetchable form; additional mirror-generated drop tables are not being promoted into the quest dataset.
