schema_version: 1
dataset: quest_walkthrough_enrichments
purpose: >-
  Upgrade historically valid but one-line area-table fallbacks into player-usable walkthroughs without
  altering the underlying source observations. Every entry is constrained to documented historical
  evidence or explicitly labelled cross-version corroboration; unresolved values stay unresolved.
authority_policy:
  historical_english_angels_wiki: primary
  period_2012_community_guides: secondary_historical
  historical_other_region_wikis: cross_version_corroboration
  current_booklet_client_database: corroboration_only
  aomega_target_client: final_verification_pending
quests:
  # Breeze / Beast Asmode chain
  cryptic-moon-swamp-killing-marsh-frogs-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with the Spy Angel at (22,155) in Cryptic Moon Swamp after completing Looking for Spy Angel.
      - Defeat 50 Marsh Frogs in Cryptic Moon Swamp.
      - Return to the Spy Angel at (22,155) to report.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/cryptic-moon-swamp.yaml, data/quests/research/legacy-guides/breeze/beast-quests.yaml]
  cryptic-moon-swamp-disguise-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with the Spy Angel at (22,155) in Cryptic Moon Swamp after Killing Marsh Frogs.
      - Travel to Jade Vale and defeat Magic Eye Members until the required robber/secret badge drops.
      - Return the badge to the Spy Angel at (22,155).
    evidence_paths: [data/quests/research/walkthrough-intake/areas/cryptic-moon-swamp.yaml, data/quests/research/legacy-guides/breeze/beast-quests.yaml]
    caveat: Historical sources alternate between the English labels Robber Badge and Secret Badge; preserve both as aliases until target-client confirmation.
  jade-vale-are-you-evil-enough-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with Asmode in Jade Vale at approximately (300,72).
      - Return to the Spy Angel at (22,155) in Cryptic Moon Swamp as instructed.
      - Go back to Jade Vale and speak with the Archaeologist around (80,10).
      - Complete the Archaeologist's required relic task and obtain the Cultural Relics.
      - Give the Cultural Relics to Asmode in Jade Vale.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/jade-vale.yaml, data/quests/research/legacy-guides/breeze/beast-quests.yaml]
  jade-vale-magic-stone-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with Asmode in Jade Vale after completing Are you Evil Enough?.
      - Travel to Mysterious Garden.
      - Find the monkey statue holding a crowned egg at (257,26) and activate it.
      - The statue transports you to Asmode's Den; continue the chain there.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/jade-vale.yaml, data/quests/research/walkthrough-intake/areas/mysterious-garden.yaml]
    conflicts:
      - A 2012 community guide places the statue at (258,56); the historical dedicated English quest evidence places it at (257,26), which is preferred here.
  mysterious-garden-evil-student-leader-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Use the Magic Stone/statue route in Mysterious Garden to enter Asmode's Den.
      - Defeat Asmodeus in the den.
      - Return to the Breeze Spy Angel at (22,155) in Cryptic Moon Swamp to finish the Asmode chain.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/mysterious-garden.yaml, data/quests/research/legacy-guides/breeze/beast-quests.yaml]

  # Steel Asmode chain
  iron-castle-inexperience-3-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Reach character level 20 and Rank 2 as a Steel-faction character.
      - Speak with the Iron Castle Angel at approximately (63,161) to begin the Steel Asmode progression.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/iron-castle.yaml, data/quests/research/legacy-guides/steel/steel-quests.yaml]
    caveat: Historical sources disagree whether the displayed reward is EXP or Credit; the walkthrough does not resolve that conflict.
  cactus-plain-disguise-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with the Steel Spy Angel at (59,138) in Cactus Plain after the preceding Asmode task.
      - Travel to Gebuer Vale.
      - Defeat Gebuer Cadres until the required Secret Badge / Gebuer Army Badge drops.
      - Return the badge to the Spy Angel at (59,138) in Cactus Plain.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/cactus-plain.yaml, data/quests/research/legacy-guides/steel/steel-quests.yaml]
    caveat: Historical sources use both Secret Badge and Gebuer Army Badge for the quest item.
  burning-desert-are-you-evil-enough-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with Asmode in Burning Desert at approximately (285,22).
      - Return to the Steel Spy Angel at (59,138) in Cactus Plain.
      - Go back to Burning Desert and speak with the Surgeon at approximately (175,142).
      - Complete the required serum-related task if it has not already been completed and obtain the Dog Tags from the Surgeon.
      - Give the Dog Tags to Asmode at approximately (285,22).
    evidence_paths: [data/quests/research/walkthrough-intake/areas/burning-desert.yaml, data/quests/research/legacy-guides/steel/steel-quests.yaml]
  burning-desert-magic-stone-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Speak with Asmode in Burning Desert after completing Are you Evil Enough?.
      - Travel to Gebuer Vale.
      - Activate the monkey statue holding a crowned egg at (7,247).
      - The statue transports you to Asmode's Den; continue the chain there.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/burning-desert.yaml, data/quests/research/walkthrough-intake/areas/gebuer-vale.yaml]
  gebuer-vale-evil-student-leader-asmode:
    source_class: researched_historical_enrichment
    steps:
      - Use the Gebuer Vale statue at (7,247) to enter Asmode's Den.
      - Defeat Asmodeus in the den.
      - Return to the Steel Spy Angel at (59,138) in Cactus Plain to finish the Steel Asmode chain.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/gebuer-vale.yaml, data/quests/research/legacy-guides/steel/steel-quests.yaml]

  # Dark City progression and repeatable board
  dark-city-register-at-dark-city-angel:
    source_class: researched_historical_enrichment
    steps:
      - As a Dark/Shadow-faction character, speak with the Dark City Angel at (313,70) in Dark City and complete the registration/report dialogue.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/dark-city.yaml]
  dark-city-knowing-dark-city:
    source_class: researched_historical_enrichment
    steps:
      - After registering in Dark City, find Risker Zalfer at approximately (298,62).
      - Speak with Risker Zalfer to complete the city-introduction step.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/dark-city.yaml, data/quests/research/legacy-guides/dark/shadow-quests.yaml]
  dark-city-inexperience:
    source_class: researched_historical_enrichment
    steps:
      - Complete the preceding Dark City introduction.
      - Speak with Executive Puyi at (181,83) in Dark City to complete Inexperience and unlock the faction repeatable progression.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/dark-city.yaml, data/quests/research/legacy-guides/dark/shadow-quests.yaml]
  dark-city-a-stab-in-the-back:
    source_class: researched_historical_enrichment
    steps:
      - At level 10-14, take the repeatable quest from Executive Puyi at (181,83) in Dark City.
      - Travel to Shadowy Path and defeat 30 Skeletal Snipers.
      - Return to Executive Puyi at (181,83) to turn in the quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/dark-city.yaml]
  dark-city-tentical-in-shadow:
    source_class: researched_historical_enrichment
    steps:
      - At level 10-14, take the repeatable quest from Executive Puyi at (181,83).
      - Travel to Shadowy Path and defeat the boss Red-Hooded Skull Header.
      - Return to Executive Puyi in Dark City.
