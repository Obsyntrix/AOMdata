    steps:
      - At level 30+, take the repeatable quest from Executive Puyi at (181,83).
      - Travel to Memory Cave and defeat the boss Evil Cat Yese.
      - Return to Executive Puyi in Dark City.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/dark-city.yaml]
  shadowy-path-railway-guard:
    source_class: researched_historical_enrichment
    steps:
      - At level 20+, speak with the Sickle Soldier at (213,143) in Shadowy Path.
      - Obtain a 1-star Piercing Hammer as requested; the historical quest text says to buy/bring one rather than farm a specific monster.
      - Return to the Sickle Soldier at (213,143) to complete Railway Guard.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/shadowy-path.yaml]

  # Dungeon / Demon Kitchen
  sad-abyss-association-member-s-demand:
    source_class: researched_historical_enrichment_with_explicit_gap
    steps:
      - At level 60+, accept Association Member's Demand in Sad Abyss from its issuing NPC.
      - Defeat 40 Imp Elves in Sad Abyss.
      - Return to the issuing NPC to complete the repeatable quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/sad-abyss.yaml]
    caveat: The surviving English Sad Abyss page preserves the quest, level, objective and reward but does not identify which NPC issues it. No giver is inferred.
  sad-abyss-labor-s-misery:
    source_class: researched_historical_enrichment
    steps:
      - At level 60+, speak with the Root Member at (159,22) in Sad Abyss.
      - Defeat Evil Knights until you collect 10 Mine Tools.
      - Return the 10 Mine Tools to the Root Member at (159,22).
    evidence_paths: [data/quests/research/walkthrough-intake/areas/sad-abyss.yaml]

  # Lost Atlantis
  golden-beach-let-s-fight-1-of:
    source_class: researched_historical_enrichment
    steps:
      - At level 50+, speak with Traveler Landy at (35,66) in Golden Beach.
      - Defeat Puqi Turtles in Golden Beach; the primary area table requires 35, while a 2012 period guide says 30 before reporting back.
      - Report to Traveler Landy.
      - Defeat 35 Color Crabs in Golden Beach.
      - Return to Traveler Landy to complete the quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/golden-beach.yaml, data/quests/research/legacy-guides/atlantis/holiday-in-puqi-village.yaml]
    conflicts:
      - Primary historical area table says 35 Puqi Turtles; 2012 walkthrough says 30. Preserve the disagreement pending target-client verification.
  palm-base-purify:
    source_class: researched_historical_enrichment
    steps:
      - Speak with the Ocean Scholar at (287,135) in Palm Base.
      - Gather 200 Pollutions from underwater resource nodes.
      - Return to the Ocean Scholar after collecting all 200.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/palm-base.yaml]
    caveat: The English historical page does not preserve the required gathering level or reward; those values must remain unknown until independently verified.
  puqi-village-wandering-artist:
    source_class: researched_cross_version_enrichment
    steps:
      - Speak with Teny at (212,35) in Puqi Village; this is a producer/gatherer repeatable quest.
      - Obtain the Whelk Shell component used by Wandering Artist and the production materials for the handicraft option Teny requests.
      - Cross-version historical evidence indicates four craft branches, each requiring 10 shell components plus 200 of its matching producer material.
      - Return the requested materials to Teny to receive the corresponding Teny card reward.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/puqi-village.yaml]
    caveat: Exact English branch-material names/counts beyond the 10-shell/200-material pattern come from non-English historical AngelLove evidence and remain pending AOmega target-client confirmation.
  puqi-village-explore-blue-slat-crystal:
    source_class: researched_historical_enrichment_with_explicit_gap
    steps:
      - At level 70+ with a gathering skill, speak with Mr.Howsufa at (93,139) in Puqi Village.
      - Travel to Wave Harbor and gather Blue Slat Crystals.
      - Return to Mr.Howsufa with the required crystals to complete the quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/puqi-village.yaml]
    caveat: The surviving English historical area page does not preserve the required quantity, repeatability, or reward; these are deliberately not guessed.
  shining-coast-boaster:
    source_class: researched_historical_enrichment
    steps:
      - At level 55-60, speak with Mouther at (108,164) in Shining Coast.
      - Defeat 30 Color Crabs and 30 Crab Generals.
      - Return to Mouther at (108,164) to complete the repeatable quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/shining-coast.yaml]
  shining-coast-pupu-turtle-and-pup-crab:
    source_class: researched_historical_enrichment
    steps:
      - At level 60-65, speak with the Young Farmer at (222,241) in Shining Coast.
      - Defeat 30 Puqi Isle Crabs and 30 Evil Puqi Turtles.
      - Return to the Young Farmer at (222,241) to complete the repeatable quest.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/shining-coast.yaml]
  shining-coast-meeting-robbers-3-of:
    source_class: researched_historical_enrichment
    steps:
      - After completing The Misbehaved Son and reaching level 60+, speak with Lad Stany at (39,213) in Shining Coast.
      - Defeat Puqi Pirates and Puqi Pirate Leaders around the pirate area; a 2012 guide places them around (164,160).
      - Recover Stany and Wendy's Red Love Necklace and Blue Love Necklace.
      - Give both Love Necklaces to Lad Stany at approximately (39,213).
    evidence_paths: [data/quests/research/walkthrough-intake/areas/shining-coast.yaml, data/quests/research/legacy-guides/atlantis/holiday-in-puqi-village.yaml]
  wave-harbor-big-eyes:
    source_class: researched_historical_enrichment_with_explicit_gap
    steps:
      - Accept the repeatable Big Eyes quest from Eye Eric in Wave Harbor; the historical page does not preserve his coordinates.
      - Defeat Scale Fish in Wave Harbor until you obtain 30 Merman's Eyes.
      - Return the 30 Merman's Eyes to Eye Eric.
    evidence_paths: [data/quests/research/walkthrough-intake/areas/wave-harbor.yaml]
    caveat: The English historical page contains placeholder text for the faction/level requirement and Eye Eric's coordinates, so those values remain unresolved.
