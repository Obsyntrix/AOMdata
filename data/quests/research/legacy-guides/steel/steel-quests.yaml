body_lines_raw:
- We start new journey with Steel ‘s Quests. In the Steel Quest have seven quest with sub quest. We ignore 1st and 2nd sub quests. We start wih
- Executive Newbie - Steel
- 1. Get blessing from Blessing Angel (57,21) at Angel Lyceuma.
- 2. Get some portion with Healer (114,57) at Iron Castle.
- 3. Repair equipment with Technician (81,47) if required.
- Searching for spy Angel
- 1. Find Iron Castle Angel (64,161) to get quest at Iron Castle.
- 2. Head to Cactus Plain and see Spy Angel(59,138).
- Killing Plateau Monkey
- 1. Killing 50 Plateau Monkey (135,168).
- 2. Report to Spy Angel
- Disguise
- 1. Go to Gebuer Vale and kill Gebuer Cadres (187,179) to get Army Badge.
- 2. You can update skill until lvl40 at Gebuer Vale.
- 3. After Finish see Spy Angel at Cactus Plain
- Executive Asistant – Steel
- Obtaining Asmode’s trust
- 1. Talk to Asmode (286,21) at Burning Desert
- Are you Evil Enough?
- 1. Ask Castus Plain Spy Angel
- 2. Talk to Surgeon (175,142) and ask for help at Burning Desert
- 3. Get 5 serum with kill Toxic Spiders(260,100)
- 4. Talk to Surgeon again.
- 5. Give Tin Card to Asmode
- Magic Stone
- 1. Look for Monkey Statue Holding An Egg(10,127) in Gebuer Vale.
- Evil Student Union Leader
- 1. Defeat Asmodeus
- 2. Talk to Cactus Plain’s Spy Angel(59,138).
- Rare Lizard’s skin
- 1. Talk to Wishing Tear’s Desert Trip(81,107)
- 2. Collect 10 Lizard Skin with kill Desert Lizard (178,31)
- 3. Talk to Wishing Tear’s Desert Trip(81,107)
- Rare Toad skin
- 1. Kill Ocher Toad (63,73) to get Toad Skin
- 2. Talk to Wishing Tear’s Desert Trip(81,107)
- Traveler’s worry
- 1. Talk to Desert Merchant (132,70)
- 2. Kill 20 Desert Mouse (165,145)
- Executive – Steel
- Parts and Desert Mouse
- 1. Talk to Scrap Collector (25,45).
- 2. Kill the Desert Mouse (165,145) to get Part.
- Wild flavor
- 1. Talk to Glutton(180,102)
- 2. Kill Desert Lizard to get meet.
- Testing apparatus of Water resource
- 1. Talk to Researcher Kente (148,69)
- 2. Go to Science Research Center in Iron Castle and see Researcher Along (78,80)
- 3. Give Model TX-11 to Researcher Kente (148,69)
- Experiment of desert animal
- 1. 1. Talk to Researcher Kente (148,69)
- 2. Kill 10 Ocher Toad (63,73)
- 3. Kill 10 Desert Lizard (178,31)
- Strange Robot
- 1. Talk to Researcher Kente (148,69)
- 2. Go to Southern Scrap Iron Zone (28,12) and look for dark shadow
- Genius scientist
- 1. Talk to Researcher Kente (148,69)
- 2. Go Scrap Iron Village and find Scientist Edison (199,85)
- Breakdown of Robot
- 1. Talk to Engineer(157,112)
- 2. Kill 20 Buccinal Robot (124,68)
- 3. Talk to Engineer(157,112) again
- Senior Executive – Steel
- Disgusting and radiant creature
- 1. Talk to Worker (209,114) at Scrap Iron Village
- 2. Kill 10 Radiant Slarms (280,96)
- Parts collection
- 1. Talk to Repair Worker(216, 70)
- 2. Kill Fat Robots (111,46) to get UME framework and Kerosene can.
- Talking construction manual
- 1. Talk to Designer (177,88)
- 2. Kill Fat Robots (111,46) to get Blueprint
- Correlation between metal
- 1. Talk to Edison(201,86)
- 2. Find Einstein (74,85) in research Center in Iron Castle to give a latter
- 3. Handover metal to Edison(201,86)
- Power source for experiment
- 1. Talk to Edison(201,86) again.
- 2. Kill Turbo Robot to get Power Furnace
- Medium of chemical formula
- 1. Talk to Edison(201,86) again.
- 2. Kill 20 spear Lizardman (148,82) at Cuctus Plain
- Lizardman’s constant attack
- 1. Talk to Chief (43,153) at Custus Plain
- 2. Kill 20 spear Lizardman (148,82)
- Chief Executive – Steel
- Plateau Monkey
- 1. Talk to Chief (43,153) at Custus Plain
- 2. Kill 20 Plateau Monkey(119,139)
- Missing necklace
- 1. Talk to Pestle Guard (53,140)
- 2. Kill Plateau Monkey (119,139) to find necklace
- Mysterious pieces
- 1. Get Mistic Piece during kill Plateau Monkey (119,139).
- 2. See Scholar Francise (43,80) at Iron Castle
- Collecting Lizardman’s bone
- 1. Talk to Biologist (86,50)
- 2. Kill Lizardman to get Lizard’s skull, rib, shank, and arm bone.
- Picking Cactus fruit
- 1. Talk to Sam (96,45)
- 2. Plateau Monkey (119,139) to get 3 Cactus Fruits
- Knack of promotion
- 1. Talk to Sam (96,45)
- 2. Defeat Lizard Lisad (229,72)
- 3. Give Lizard Lisad head to Sam
- Reporting achievement
- 1. Talk to Sam (96,45)
- 2. Go to Burning Desert and talk to General Allie (38,162)
- Elite Executive – Steel
- Sprite in war
- 1. Talk to Chief (166,152) at Burning Desert
- 2. Defeat 20 mummy and Pharaoh (190,40)
- Toxic Spider in Desert
- 1. Talk to Chief (166,152) at Burning Desert
- 2. Defeat 20 Toxic Spider (150,110)
- Winning achievement
- 1. Talk to General Allie (37,162)
- 2. Kill 20 Gebuer at Gabuer Vale (90,80)
- 3. Report the result to General Allie (37,162)
- Blood Sacrifice
- 1. Click on the gravestone (51, 75)
- 2. Kill Gebuers to get blood at Gebuer Vale(90,80)
- 3. Pour the Gebuer’s blood on the gravestone (51, 75)
- Missing Friend
- 1. Talk fo Dinot (144,134)
- 2. Kill Toxic Spider (150,110) to find Takice’s Bracer
- Destroying spider eggs
- 1. Talk fo Dinot (144,134)
- 2. Destroy eggs at northern(285,133), southeast(288,61), entrance(292,96) and western(231,93).
- 3. Talk back to Dinot.
- Carrigh’s temptation
- 1. Talk fo Dinot (144,134)
- 2. Find 3 Carrion will kill mummy and Pharaoh (190,40)
- Steel Quest Expert
- Black Widow
- 1. Put carrion on the platform at the eastern entrance of cave(286,101)
- 2. Black Widow appear and kill it.
- 3. Report to Dinot (144,134)
- Rotten Bird’s Feather
- 1. Click on the old totem (114, 44)
- 2. Defeat Rotten Birds(175,27) until you obtain 10 Rotten Bird‘s Feathers.
- 3. Put the Rotten Bird’s Feather under the totem (114, 44).
- Ring of Caravan
- 1. While defeating Gebuer obtain an Unclaimed Ring
- 2. Find out the original owner of the ring.
- 3. Speak to the Desert Merchant (27,149) Burning Desert. It will turn out to be his. He gave it to a Gebuer who saved him.
- Detecting Foundain
- 1. Talk to Spy Sungier(263,167) at Burning Desert.
- 2. Go to North Gebuer Vale water area to find Spy Lude(80,261)
- 3. Luke ask to send a word to Spy Sungier(263,167)
- Gebuer’s Proposal
- 1. Talk to Pastle Aider(39,162) at Burning Desert
- 2. Defeat Gebuer Cadre at (190, 160) Gebuer Vale until you obtain the Gebuer‘s Fighting Proposal
- 3. Talk to Pastle Aider(39,162)
- Strange Black Feather
- 1. Go to the Rotten Bird Nest (188, 80) and collect a Black Feather from it by clicking
- 2. Take this feather to Burning Desert and speak with the Myth Scholar(51,164) for more information.
- Collecting Herbs
- 1. speak with the Myth Scholar(51,164)
- 2. Collect 10 Gebuer’s Teeth (190,160) at Gebuer Vale and 10 Lizardman’s Tail (207,36) at Cactus Plain
- 3. speak with the Myth Scholar(51,164) at Burning Desert again
- Huge Rotten Bird
- 1. Pour the potion into the nest (188, 80) in Gebuer Vale
- 2. Kill Gian Bird
- 3. Speak with the Myth Scholar(51,164) at Burning Desert
