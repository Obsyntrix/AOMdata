body_lines_raw:
- A will to risk
- 1.Talk to Gustav(325,92) at Flaming Door
- 2.Ask Doktor Cliss(328,20) at Breeze Woods to help and get Arcanum
- '3.Collect medicinal material Cliss need: 4 Fire Core of Imp Elf(185,76) at Sad Abyss,6 Anti-inflammatory Gel of Rock Slarm(96,142) at Flaming Door and 1 Cooling Oil of Terra Lampman
  (210,49)'
- 4.Request Doktor Cliss(328,20) at Breeze Woods make Arcanum and pay 5000
- 5.Take the Arcanum to Gustav(325,92) at Flaming Door immediately
- 6.Request anyone of House Pickets(213,77) at Angel Lyceum to stop soul of Gustav.
- 7.Defeat many Flame Mummies(132,43) at Flaming Door and get back the big bag of Gustav.
- 8.Bury Gustav's(325,92) body together with his big bag
- Firm Faith
- 1.Talk to Warrior Athor(161,93) at Sad Abyss
- 2.Defeat monsters besieging Athor such as 50 Heat Elf(72,158), 30 Evil Grass(157,84), and 35 Hell Slave(79,46).
- 3.Break through successfully ang let Warrior Athor(161,93) know.
- Devil's Whispering
- 1.Talk to Sick Zapo(237,143) at Flaming Door
- 2.Destroy the monsters whispering in his mind 40 Fire Ghost Kid(249,95)
- 3.Return to visit Sick Zapo(237,143) and Destroy the monsters whispering in his mind 40 Poison Flower(74,44)at Underground Square.
- 4.Return to visit Sick Zapo(237,143) and destroy the monsters whispering in his mind Soul Guide.
- 5.Return to visit Zapo.
- Ash to ash Dust to dust
- 1.Talk with Seer Fouger at Dark City
- '2.Take following materials to Seer Fouger to make Holy Hammer: 50 Black silver, 30 Bamboo Strip and 30 Primrose Thread.'
- Follow in the Footsteps of Hero
- 1.Talk to Knight Statue(277,55) at Underground Square
- 2.Defeat Wanderer to get Broken Sword and then take it to Headless Knight Statue.
- 3.Defeat Giant Rotten Fly(70,87) at Lava Cave to get Broken Shield and then take it to Headless Knight Statue.
- 4.Defeat Soul Wizard (262,67) at Flaming Door to get Broken Armor and then take it to Headless Knight Statue.
- 5.Defeat Enmity Deissy(132,64)at Underground Square to get Broken Boots and then take it to Headless Knight Statue.
- Diary Collection
- 1. The Character must Dead or Mode Angel, then go talk to Bone Remains(175,107)
- 2.Find Diary P1 Terra Miners(60,103),Diary P2 Rotten Slarms(28,112), Diary P3 Riddle Bishop(200,91) and P4 Injuried Angel(70,120) in Hell Palace may have it
- 3.investigate Hell Palace's skeleton-Bone Remains(175,107)
