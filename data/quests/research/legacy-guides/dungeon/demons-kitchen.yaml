body_lines_raw:
- New Scheme of Evil Lyceum
- 1. Talk to Faction Angel such as Breeze Wood Angel (324,96)
- 2. Talk to Angel Inspector(47,157) at Megalith Plain
- Investigate Evil Food
- 1. Find someone suffering food poisoning in Iron Castle-Machel (332,52)
- 2. Find someone suffering food poisoning in Dark City-Romier (209,173)
- 3. Find someone suffering food poisoning in Breeze Woods-Michael(100,165)
- 4. Find someone suffering food poisoning in Aurora City-Nemize(284,206)
- 5. Report to Angel Inspector(47,157) at Megalith Plain
- Food Material Collection
- 1. Talk to Angel Inspector(47,157) at Megalith Plain
- 2. Find Chef Boshid (159,17) at Dragon Graveyard and talk to him
- 3. Find 5 Poisonous Mashed Apple, 5 Smoky Pitch, 10 Excitement Drop, 10 Rotten Beast Meat with kill Cirtus Tyrant(227,106)at South of Mirror Lake, Tree Elf(54,114) at Mysterious Wetland,
  Water Goblin (287,63) at North of Mirror Lake and Savage Dogface (71,14) at Thorn Wasteland
- 4.Talk to Chef Boshid (159,17) at Dragon Graveyard again
- Exposed Plot
- 1. Talk to Angel Inspector(47,157)at Megalith Plain
- 2. Take the strange dishes to Healing Lecturer(94,106) at Angel Lyceum for assay
- Treatment for Food Poisoning
- 1. Collect antidote and material for 3 Healing Lecturer Evil Bolus, 5 Shrub Bark, 5 Nature Prime and 1 Pure Fire Crystal with kill Hook Barft (21,139) at Dragon Draveyard, Savege Priest(247,56)
  at Thorn Wasteland, Marsh Wind Fairy(47,12) at Mysterious Wetland and Burning Monster (238,161) at Thunder Ruin.
- 2. Talk to Healing Lecturer(94,106) at Angel Lyceum
- 3. Talk to Angel Inspector(47,157) at Megalith Plain
- Learning from Chef Boship
- 1. Talk to Chef Boshid (159,17) at Dragon Graveyard
- 2. Find Mayloe (110,108) at Fiery Path
