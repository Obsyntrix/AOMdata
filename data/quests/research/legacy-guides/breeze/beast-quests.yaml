body_lines_raw:
- Executive Newbie - Beast
- '-------------------------'
- Explorer Golan's Requirement
- 1. Find Explorer Gulin(292,88)in Breeze Woods
- 2. Find Militia Chief(191,113)
- Reaching higher level
- 1. Talk to BreezeWood Angel(324,96)
- 2. After Character gain lvl 20 and Rank, Talk to BreezeWood Angel(324,96) again.
- Looking for Spy Angel
- 1. Talk to BreezeWood Angel(324,96)
- 2. Talk to Spy Angel(22,155) at Crytic Moon Swamp
- Killing Marsh Frog
- 1. Talk to Spy Angel(22,155)
- 2. Kill 50 Marsh Frog (90,90)
- Disguise
- 1. Talk to Spy Angel(22,155)
- 2. Get Robber's Badge with kill Magic Eye Member(243,155) at Jade Vale
- 3. Talk to Spy Angel(22,155) at Crytic Moon Swamp again
- Executive Assistent - Beast
- '---------------------------'
- Obtaining Asmode's trust
- 1. Talk to Spy Angel(22,155)
- 2. Find Asmode(300,72) and talk to him at Jade Vale
- Are You Evil Enough?
- 1. Talk to Asmode(300,72)
- 2. Talk to Spy Angel(22,155) at Crytic Moon Swamp
- 3. talk to Archaeologist (80,10) in Jade Vale for help
- 4. Quests Delaying of Ruin Study - Get learning Rolling Bar with kill Unicorn Rabbit (207,11)
- 5. Give Cultural Relics to Asmode(300,72)
- Magic Stone
- 1. Talk to Asmode(300,72)
- 2. Look for monkey Statue Holding An Egg(258,56)in Mysterious Garden
- Evil Student Union Leader
- 1. Defeat Asmode
- 2. Talk to Spy Angel(22,155)
- Dancing Shadow
- 1. Talk to Herbalist Hebu(130,70)
- 2. Defeat 30 Forest Monkey(180,60)
- The Reivers
- 1. Talk to Herbalist Hebu(130,70)
- 2. Kill Nest Tree Elves(120,70) to get Mushroom
- Fiery Bud
- 1. Talk to Herbalist Hebu(130,70)
- 2. Kill Frame Lily (202,9)to get Fiery Bud
- Executive - Beast
- '-----------------'
- Inquire for Spore Collection
- 1. Talk to Herbalist Hebu(130,70)
- 2. Talk to Botany Assistant(184,52) at Mushroom Forest
- Man-eating Flower Masque
- 1. Talk to Merchant Wushor (210,118)
- 2. Kill Wild Lily (155,75) go get 10 Petal
- Inspection Tour
- 1. Talk to Militia Chief (225,109)
- 2. Hand document to Bog Sentinel (235,48) and Jungle Sentinel(24,139) at Dense Forest
- 3. Talk to Militia Chief (225,109) at Dense Forest
- Fighing Ceremony
- 1. Talk to Jungle Priest (212,108)
- 2. Get 10 tufts of Monkey Hair(180,60)
- Guarding Ceremony
- 1. Talk to Jungle Priest (212,108)
- 2. Kill Nest Tree Elves(120,70) to get 10 Wind Leaf
- Ceremony of Playing for Rain
- 1. Talk to Jungle Priest (212,108)
- 2. Collect 10 Icy Petal from Wild lily(155,75)
- Good Spore Collection
- 1. Talk to Botany Assistant(184,52)
- 2. Collect 10 good sprores from Red Mushroom (170,35)
- Senior Executive - Beast
- '------------------------'
- Golden Matsuake
- 1. Talk to Tailman Pan(212,21)
- 2. Get Information about the Golden Matsuake from the two members in North (207,237) ans West gate
- Disappeared Golden Matsuake
- 1. Talk to Tailman Pan(212,21)
- 2. Get information about Golden Matsuake from Mane Boar (152,123)
- 3. Give Matsuake Residue to Tailman Pan(212,21)
- Boar Lord
- 1. Talk to Tailman Pan(212,21)
- 2. Defeat Iron Mane Blaic (89,225)
- Sacral Praise
- 1. Talk to Tailman Pan(212,21)
- 2. Give the letter to Pontiff (202,139) hiwand in Cyptic Moon Swamp
- Venom Collection
- 1. Talk to Newbie Wizard (176,50)
- 2. Collect 10 Purple Musroom Venom (60,60)
- Hungry Robber
- 1. Talk to Robber Hork (36,48)
- 2. Get 10 Mushroom pieces from Red Mushroom and 10 Pork pieces from Mane Boar
- Ancient Books
- 1. Talk to Robber Hork (36,48)
- 2. Go to library of Breeze Woods take Abyssal Sadness(17,122)
- Chief Executive - Beast
- '------------------------'
- Naughty Elf
- 1. Talk to Militia Solder (44,149)
- 2. Drive away 20 Elf (50,150)
- Indundant Toad Eggs
- 1. Talk to Militia Solder (44,149)
- 2. Eliminate 20 Marsh Frog (120,70)
- Inundant Mud Crab
- 1. Talk to Militia Solder (44,149)
- 2. Eliminate 20 Mud Crab (235,70)
- Confirm Safety around Alta
- 1. Talk to Assistant Breeze(63,140)
- 2. Talk to the Two priests in northern(216,146) and eastern (228,28) Altars
- Totem Destroyer
- 1. Talk to totem (178,7) at south Cryptic Moon Swamp.
- 2. Eliminate 10 Mud Crab(235,70) and 10 Marsh Frog(120,70).
- Fisher Stone's Distress
- 1. Talk to Fisher Stone(184,47)
- 2. Eliminate 20 Mud Crab (235,70)
- Ritual Pollen
- 1. Talk to Shiwand(203, 139)
- 2. Collect 10 Ritual Pollen from Wild Lily in Dense Forest
- Elite Executive - Beast
- '-----------------------'
- Sage's Staff
- 1. Talk to Shiwand(203, 139)at south Cryptic Moon Swamp.
- 2. Get Sage's Staff from sharker(93,98) in Breeze Wood
- Break Seal
- 1. Talk to Shiwand(203, 139)
- 2. Give Sharker's(93,98) letter to Pontiff in Breeze Wood
- 3. Talk to Sharker again
- '4. Collect 3 kinds of essences: Wind, Sand and Water from'
- Elves,Marsh Frogs and Mud Crabs
- 5. Talk to Sharker(90,100) again in Breeze Wood
- Fight for Ruins
- 1. Talk to Militia Solder(282,56) at Jade Vale
- 2. Defeat 20 Magic Eye Member(290,120)
- Delaying of Ruins Study
- 1. done during Are You Evil Enough? quest
- Damnable Green Lizard
- 1. Talk to Fisher Chark (176,35)
- 2. Eliminate 20 Green Lizard (75,50)
- Ancient Book Rubbing
- 1. Talk to Pillar (257,168)
- 2. Purchase In form Breeze Word Library Clerk(11,121) Ink and
- Paper
- 3. Talk to Pillar (257,168) again
- 4. After get the scroll, talk to Training Priest(290,75)
- Mastic Words
- 1. Talk to Training Priest(290,75)
- 2. Get 10 Green Lizard Squama(75,50) and 10 Unicorn Rabbit Horn(265,37).
- Beast Quest Expert
- '------------------'
- Verify Ability
- 1. Talk to Training Priest(290,75)
- 2. Enchase the Incantation stone into the flute on the stele
- 3. Talk to Pillar (257,168)
- 4. Defeat Relic Sealed Beast
- Save Garden
- 1. Talk to dead patch of grass at (121, 142)
- 2. Defeat 20 Flaming Roses (165,150)
- Sleeping Spirit
- 1. Talk to Household (154,103)
- 2. Talk to Wester Exit Labor(82,138) and Eastern Pool Labor(266, 110)
- Magic Pool
- 1. Talk to statue by the pool (181, 193)
- 2. obtain 10 Star Dust with kill Garden Elf (120,55)
- Searching for Gaze's Grave
- 1. Talk to Mistress Marlin (180,110)
- 2. Find Gaze's grave(62,131)
- 3. Talk to Mistress Marlin (180,110) again
- Marlin's Bone
- 1. Talk to Mistress Marlin (180,110)
- 2. Kill Thunder Rabbit(70,115) to get Marlin's bones
- Reunion
- 1. Talk to Mistress Marlin (180,110)
- 2. Bring Marlin's Bone to Gaze's Grave (62,131)
- 3. Talk to Magnet Gaze (57,130)
- 4. Kill Rage Elf
- 5. Talk to Magnet Gaze (57,130) again
