body_lines_raw:
- Executive Newbie –Aurora
- Inexperience
- 1. See Explorer Lim(209,184)
- 2. Look for the Guard Captain (157,115)
- Reaching higher level
- 1. See Aurora Angel (189,183)
- Looking for Spy angel
- 1. Talk to Spy Angel(71,176) at Dawn Harbor
- Show speed and destroying
- 1. Defeat grey Mouse (138,125)
- 2. Talk to Spy Angel(71,176) again
- Disguise
- 1. Get secret Badge Piratekin at Riprap Coast
- 2. Talk to Spy Angel(71,176) again
- Executive Assistant – Aurora
- Obtaining Asmode’s trust
- 1. Find Asmode (263,178) at Riprap Coast and talk with him
- Are you evil enough?
- 1. Talk to Spy Angel(71,176) at Dawn Harbor
- 2. Talk with Cherry’s Leader(236,73) at Cherry village for aid
- 3. Find Golden Key, Silver and Copper with kill Piratekin
- 4. Go to Riprap Coast to find the property robbed (67,170)
- 5. Return the found Pearl to Village leader- Cherry’s Leader(236,73)
- 6. Hand Village leader’s Pearl to Asmode (263,178) at Riprap Coast
- Magic Stone
- 1. Look for Monkey Statue Hollding An Egg(29,30) in Chery Village
- Evil Student Union Leader
- 1. Talk to Monkey Statue Hollding An Egg(29,30)
- 2. Kill Asmode
- 3. Talk to Spy Angel(71,176) at Dawn Harbor
- Annihilating mice
- 1. Talk to Spike Farmer (88,118)
- 2. Kill 10 Field Mouse (130,114)
- Magic trick
- 1. Talk to Spike Farmer (88,118)
- 2. Kill 20 pumpkin (128,23)
- The Jackstraw’s protest
- 1. Talk to Spike Farmer (88,118)
- 2. Kill 20 Jackstraw (156,108)
- Executive – Aurora
- Sending Parcels
- 1. Find Farm Mistress (53,53)
- 2. Take the parcel to Manor Keeper (100,151) of Sunflower Plain
- Delicious Pumpkin Pie
- 1. Talk with Farm Cook (108,121)
- 2. Kill 10 pumpkin (128,23)
- Maintain Cleanness of surrounding
- 1. Talk with Farm Cook (108,121)
- 2. Kill 20 Field Mouse (130,114)
- Roasted Sashimi
- 3. Talk with Farm Cook (108,121)
- 4. Kill 10 Jackstraw (156,108)
- The Pumpkin’s bad deed
- 1. Talk to Clerk (133,171)
- 2. 20 Kill Magic Pumpkinmen
- Preparation for winter
- 1. Talk Manor Keeper (100,151)
- 2. 5 Sheep’s Woolly Curls (60,40)
- Senior Executive – Aurora
- Awakening a Love Music
- 1. Talk to Gardener (54,109)
- 2. Kill Tone Sheep (60,40) to get flute
- Rare Sheep Score
- 1. Talk to Gardener (54,109)
- 2. Kill Rare Sheep Score (107,45)
- Ardent recommendation
- 1. Talk to Gardener (54,109)
- 2. Find Fishing Leader (255,156) of Dawn Harbor
- Looking for fatman’s Ring
- 1. Talk with Rich Fatman (225,131)
- 2. Kill Evil Slarm (249,101)to get Ring
- Fetor on deck
- 1. Talk to Chief (140,160)
- 2. Kill 20 Grey Mice
- Side Dish-Salted Crabmeat
- 1. Talk to Chief (140,160)
- 2. Kill soldier Crab (240,83) to get 10 meet
- Side Dish-herb Tortoise Meat
- 1. Talk to Chief (140,160)
- 2. Kill tortoise to get 4 meet (47,100)
- Chief Executive – Aurora
- Karter’s Planning Book
- 1. Find book (190,36)
- 2. Obtain Bonnie’s Itemosal
- 3. Find Sailor Bonny (257,111) in Dawn Harbor
- 4. Handover to Karter(269,76)
- Golden Island Legend
- 1. Talk to Chief (140,160)
- 2. Talk to Retire Sailor
- Protecting boss right
- 1. Talk to Barkeeper (205,126)
- 2. Kill 20 Riprap Pirates (160,25) at Riprap Coast
- Control Plan of Sheep quantity
- 1. Talk to Fisherman (166,101)
- 2. Kill 20 Harp Sheep(200,140) at Riprap Coast
- Clearance of harbor
- 1. Talk to Fishing Leader (255,156)
- 2. Kill 20 creatures
- Request for military aid
- 1. Talk to Fishing Leader (255,156)
- 2. Give letter to Deputy Colonel(104,85) at Aurora City
- 3. See Fishing Leader (255,156) at Dawn Harbor anf tell what Deputy Colonel Said
- Being preemptive
- 1. Talk to Fishing Leader (255,156)
- 2. Kill Vice Head Pirate(31,174) at Riprap Coast
- Elite Executive – Aurora
- Glory of Dawn Harbor
- 1. Talk to Fishing Leader (255,156)
- 2. Go to Cherry Village for Cherry’s Leader (235,74)
- Defeating evil force
- 1. Talk to Policeman (192,28)
- 2. Get 5 Pirate necklace with kill Pirate (255,90) at Riprap Coast
- Unknown brilliant necklace
- 1. Get a Broken Necklace while fighting Piratekin
- 2. Necklace to the Countrylady(187,75) at Cherry Village.
- Whether husband is alive
- 1. Talk to Countrylady(187,75)
- 2. Look for clue about Noman (42,96) at Riprap Coast
- 3. See Countrylady(187,75) at Cherry Village after got Blood Hankerchief
- Father’s legacy
- 1. Talk to Countrylady(187,75)
- 2. Find Newbie Timi (78,72) at Aurora City
- Cherry Crab experiment
- 1. Talk to Scholar Nilsson(158,40)
- 2. Find 4 Cherry Crab Shell (121,31)
- Aurora Quest Expert
- Vanilla
- 1. Talk to Scholar Nilsson(158,40)
- 2. Kill Spine Turtle (220,110) to get 5 Vanilla Residue
- Protec’s attack
- 1. Talk to Scholar Nilsson(158,40)
- 2. Kill Blue Potec 185,142
- Plant research report
- 1. Talk to Scholar Nilsson(158,40)
- 2. Handover report to Scholar Yale (69,173)at Crashing Hillock
- Recruiting Cherry Militia
- 1. Talk to Robust Lady (235,49)
- 2. Kill 20 Spine Turtle (220,110)
- Militia assignment-coast
- 1. Talk to Robust Lady (235,49)
- 2. Kill 20 Cherry Crab(121,31)
- Militia assignment punishing
- 1. Talk to Robust lady (235,49)
- 2. Insert the flag into pirate camp (48,12)
- Militia assignment turtle
- 1. Talk to Robust Lady (235,49)
- 2. Kill Spine Turtle(220,110) to get 10 shell
- Shell armor
- 1. Talk to Robust Lady (235,49)
- Coastal devil
- 1. Defeat Evil Soldier Crap
