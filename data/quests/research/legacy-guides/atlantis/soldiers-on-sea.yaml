body_lines_raw:
- Depression of Skin Dive
- 1.Talk to Trainer Ceres(228,103) at Puqi Village
- 2.Kill 30 Color Crab General(34,149), 30 Ink Octopus(89,54)and 30 Beachball Jellyfish(204,37) at Colorful Coral Reef
- 3.Report to Trainer Ceres(228,103) at Puqi Village
- Mermaid Legend
- 1.Talk to Merchant Corian(122,159)at Palm Base
- 2.Go to Have Harbor, 10 shear hair of Blue Merman(208,164)
- 3.Return Palm Base to exchange with Merchant Corian(122,159)
- Keep the Sea Clean
- 1.Talk to Mermaid Lilian(18,115) at Blue Sea
- 2.Eliminate the 4 Junks in Blue Sea South Junk(118,13), Southeast Junk(281,17), Northeast Junk(280,134) and North Junk(140,167).
- 3.Report again to Mermaid Lilian(18,115)
- Fight to Reclaim Survical
- 1.Talk to Mermaid Ozzie(134,50) at Dream Ocean
- 2.Defeat Halobios Threatening Mermans 35 Stab Jellyfish(234,150) and 55 Wood Octopus
- 3.Tell to Mermaid Ozzie(134,50) the process
- Natural Enemy
- 1.Talk to Mermaid Ophelia(54,61) at Blue Sea
- 2.Defeat 40 Sea Shark(178,59) in Blue Ocean
- 3.Defeat 40 Rager Shark(178,59) in Blue Ocean
- 3.Report to Mermaid Ophelia at Blue Sea
- Soft Shimmer in Deep Sea
- 1.Talk to Diver Cobra(167,43) at Puqi Village
- 2.Get 10 Lantern from Sea Lantern Fish(277,22) at Quiet Ocean
- 3.Give Lanterns to Diver Cobra(167,43) at Puqi Village
- Reseize the Robbed Goods
- 1.Talk to General Campbell(186,98) in Palm Base
- 2.Investigate the sunken material(76,14) in Coral Vale
- 3.Reseize Confidential 8 wooden crate from ghost in Coral Vale. Kill Death Sailor and Death Sail(167,117)
- 4.Report to General Campbell(186,98) in Palm Base
