body_lines_raw:
- Eye for eye, Tooth for tooth
- 1.Talk to Kateman(102,25) at Evil Ship.
- 2.Defeat 45 Scale Soldiers
- 3.Tell Caterman the good news
- 4.Give Caterman 1 Angel Wings to leave here
- 5Tell Kere how Caterman was rescued
- The Molody of Pirates' demise
- 1.Talk Quiyam(17,17) at Puqi Village
- 2. Purify 15 Death Captain in Evil Ship
- 3.Death Souls have beeb purified, return to Quiyam(17,17) at Puqi Village
- The Leader of Radical Wing
- 1.Talk to Merkaid Polu(71,93) at Blue Sea
- 2.Find out Kassispo from Linberd Knight and destroy him. Kassispo is hiding inside Evil Ship
- 3.Task completed, report to Merkaid Polu(71,93) at Blue Se
- Octopus, the Robber
- 1.Talk to Merchant Kulepas(190,31) at Palm Base.
- 2.Reseize Good Robbed by 15 Blade Octopus in Evil Ship
- 3.Return to Merchant Kulepas(190,31) at Palm Base.
- Revive
- 1.Talk to Kateman(102,25) at Evil Ship and Find out does Merman village exist
- 2.Defeat Hicalu Test Machine at Lost Region to get back Red Shell
- 3.Take Red Shell to Mermaikd Scarlett(32,56) in Blue Sea.
- 4.Put Red Shell to Mermaid Altar(27,160) in Raging Reefs in 30 minutes.
- 5.Tell Childe Kere(132,39) in Puqi Village that Kenney relived
- The Ancient Yatiss Culture
- 1.Talk to Scholar Oxford(87,13) at Palm Base
- 2.Find the Crystal of Top Technique:Hacalu 1 in Lost Region. If it can still move and full of animus, just destroy it.
- 3.Talk to Scholar Oxford(87,13) at Palm Base again
