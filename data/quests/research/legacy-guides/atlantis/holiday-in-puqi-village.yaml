body_lines_raw:
- Let's Fight!
- 1.Talk to Traveller Landy(34,66) in Golden Beach
- 2.Drive away 30 Puqi Turtle(11,36) in Golden Beach
- 3.Tell Traveller Landy(34,66) that Turtles have been driven away
- 4.Diven away 35 Color Crab (40,32)Soldier in Golden Beach
- 5.Tell Traveller Landy(34,66) that Color Crab have been driven away
- The Misbehaved Son
- 1.Find Lad Stany(41,212) for Landy in Shining Coast.
- Meeting Robbers
- 1.Defeat Puqi Pirate and Puqi Pirate Leader(164,160) and get back Love Necklaces of Stany and Wendy:Red Love Necklace and Blue Love Necklace.
- 2.Give Love Necklaces to Lad Stany(41,212)
- A Cup of Icy Coffee
- 1.Find Childe Kere(132,39) for Puqi Village Standy
- Invaluable Rubbish
- 1.Dive into Blue Sea to find Childe Kere's diamond ring from dusthead. Go to See Junk(270,125)
- 2.Return Ocean Heart to Childe Kere(132,39)
- Lost Friends
- 1.Find Remain of Habosen Ship in Raging Reefs.Kenny's Reefs(282,161)
- 2.Return Puqi Village to find Childe Kere(132,39)
- Hope after Bad News
- 1.Dive into Coral Vale to investigate at suspicious Pack(192,161)
- 2.Show Childe Kere(132,39) Caterman's Letter
- Aborigines's Threat
- 1.Talk to General Campbell(186,98) at Palm Base
- 2.Defeat 40 Puqi Local(92,59) in Golden Beach
- 3.Report to General Campbell(186,98) at Palm Base
- 4.Defeat 35 Puqi Island Warrior(107,159) in Golden Beach
- 5.Defeat Commander Pontiff Hululu(122,161) in Golden Beach
