summary_raw: Beelzebub's third test is to find the food material for one of his students called Luxious Ba.
information_raw: 'Quest Giver Repeatable Series Luxious Ba No Dungeon

  Previous Quest Next Quest The Second Appetizer Gorily Aperitif'
requirements_raw: Faction Lvl Rank Skill Quest - 30 2 - The Second Appetizer
reward_raw: Exp. Credit Gold 40,000 500 15,000 Items None
walkthrough_raw: 'Step 1 Talk to Luxious Ba Step 2 Luxious Ba will give 5 Spell Storage Bag s. Purchase 25 more bags from Luxious Ba . The Spell Storage Bag has a 2-hour time limit if
  it is unused. If necessary, buy more bags. Each bag costs 95 Gold.

  Step 3 Defeat 30 Rock Slarm , Terra Lampmen , Evil Flower , Flame Mummy , or Fire Flies until you have 30 Carrion-filled Storage Bag s.

  Step 4 Talk to Luxious Ba .

  Step 5 Find and talk to the Annoying Clerk in front of Magic Kitchen Path in Lava Cave'
