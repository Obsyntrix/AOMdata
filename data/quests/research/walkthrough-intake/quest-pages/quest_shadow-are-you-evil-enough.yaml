summary_raw: Asmode doesn't trust you, so he asks you to desecrate a tomb in Memory Cave .
information_raw: 'Quest Giver Repeatable Series Asmode No Yes (Asmode: 6 of 8)

  Previous Quest Next Quest Obtaining Asmode''s Trust Magic Stone'
requirements_raw: Faction Lvl Rank Skill Quest Shadow 20 2 - Finished Obtaining Asmode's Trust and Husband's Skull
reward_raw: Exp. Credit Gold 500 25 - Items -
walkthrough_raw: 'Step 1 Speak with Asmode (54,15) in Degula Maze , he will ask you to prove yourself because he isn''t sure you''re a Leech. Step 2 Not sure what to do, you go to Bottomless
  Pit and speak with the Spy Angel (314,37). Step 3 The Spy Angel tells you to go to Memory Cave . Step 4 In Memory Cave speak to the Lady (78,85) and she will give you her husband''s
  skull. (Note: You must already have completed the quest Husband''s Skull to get the skull.) Step 5 Take the skull back to Degula Maze and hand them to Asmode (54,15). He will give
  you a Magic Stone (which will not appear in your inventory).'
