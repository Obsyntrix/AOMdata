walkthrough_raw: Step 1 Defeat Soul Slalin at Magic Kitchen Path and find out First Half Volume of Cookbook. You must turn on all the torch in order to summon Soul Slalin Step 2 Defeat
  Earl Makice at Gulp Room and find out Second Half Volume of Cookbook. You must click the 8 statue in this order Right Barft Statue, Left Headless Statue, Left Wolf Statue, Right Gebuer
  Statue, Right Headless Statue, Left Gebuer Statue, Left Barft Statue, Right Wolf Statue to meet up with Earl Makice Step 3 Go to Cook Betty for your reward
