information_raw: 'Quest Giver Requirements Repeatable Flora none Yes

  Summary Flora is dreaming of owning all the seeds for all the flowers in the Garden of Eden. Please help her realize her dream.

  Reward Flora Card'
requirements_raw: null
reward_raw: null
walkthrough_raw: 'Step 1 Collect: WARNING - This is a luck part you will not receive them every time you kill the following

  20 Flame Rose seeds from Flaming Roses at Mysterious Garden 20 Charm Corpse Flower Seeds from Nepenthes at Mysterious Wetland 25 Evil Flower Seeds from Evil Flowers at Fiery Path,
  Lava Cave and Flaming Door 25 Poison Evil Flower Seeds from Poison Flowers at Underground Square and Hell Palace 30 Flower Monster Seeds from Flower Monsters at Gulp Room 30 Fire Tree
  Bud Seeds from Fire Tree Buds at Gulp Room

  Step 2 Talk to Flora. Step 3 Collect:

  Queen Angela Seed from Queen Angela at Mysterious Garden Sexy Quli Seed from Sexy Quli at Mysterious Wetland Sanguinary Flower Seed from Bloody Flower at Fiery Path Charming Flower
  Seed from Charming Flower at Underground Square

  Step 4 Talk to Flora. Step 5 Find Fragrant Soside and show it to Flora.'
