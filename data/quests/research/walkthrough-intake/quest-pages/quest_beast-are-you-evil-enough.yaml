summary_raw: Asmode doesn't trust you, so he asks you to steal some antiques in Jade Vale .
information_raw: 'Quest Giver Repeatable Series Asmode No Yes (Asmode: 6 of 8)

  Previous Quest Next Quest Obtaining Asmode''s Trust Magic Stone'
requirements_raw: Faction Lvl Rank Skill Quest Beast 20 2 - Finished Obtaining Asmode's Trust and Delaying of Ruins Study
reward_raw: Exp. Credit Gold 500 25 - Items -
walkthrough_raw: 'Step 1 Speak with Asmode (301,72) in Jade vale , he will ask you to prove yourself because he isn''t sure you''re a Magic Eye Member. Step 2 Not sure what to do, you
  go to Cryptic Moon Swamp and speak with the Spy Angel (22,155). Step 3 The Spy Angel tells you to go to Jade Vale . Step 4 In Jade Vale speak to the Archaeologist (80,11) and he will
  give you Cultural Relics (an antique). (Note: You must already have completed the quest Delaying of Ruins Study to get the Relic.) Step 5 Take the relics back to Asmode (301,72) in
  Jade Vale and hand them to him. He will give you a Magic Stone (which will not appear in your inventory).'
