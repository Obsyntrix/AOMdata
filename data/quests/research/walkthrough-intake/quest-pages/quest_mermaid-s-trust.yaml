walkthrough_raw: Step 1 After talk to Mermaid Guard, she ask you for help; kill 20 Ink Octopus and 20 Wood Octopus. back with Mermaid Step 2 Kill Angel Fishs until you got a Angels Heart
  and bring it back to Mermaid. Step 3 go and kill 40 Sharks . Step 4 Talk again to Mermaid Guard. Step 5 kill Captain Nio and Merman Hulio in Dream Ocean to get Evil Lyceum's Letter
  to Linberd. Step 6 When got the Letter, give it to Merman Captain
