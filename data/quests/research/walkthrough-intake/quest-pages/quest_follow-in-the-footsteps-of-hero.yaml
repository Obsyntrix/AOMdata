  defeating Giant Rotten Fly . Once done bring it back to Knight Statue Step 3 Some more writing appear on statue. You now need to get Broken Armour by defeating Soul Wizard . Once done
  bring it back to Knight Statue Step 4 Some more writing appear on statue. You now need to get Broken Boot by defeating Enmity Deissy . Once done bring it back to Knight Statue Step
  5 Once done you receive your reward
