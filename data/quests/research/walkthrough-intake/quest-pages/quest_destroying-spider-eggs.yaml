walkthrough_raw: Step 1 Talk to Dinot. Step 2 Destroy the eggs at the northern nest (288, 60) by clicking on the pile of bones. Step 3 Destroy the eggs at the southeast nest (293, 95)
  by clicking on the pile of bones. Step 4 Destroy the eggs at the entrance nest (287, 131) by clicking on the pile of bones. Step 5 Destroy the eggs at the western nest (230, 92) by
  clicking on the pile of bones. Step 6 The Black Widow doesn't appear, go back and talk to Dinot.
