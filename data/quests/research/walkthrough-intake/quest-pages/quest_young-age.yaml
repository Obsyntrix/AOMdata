summary_raw: The Executive Chief and his wife each made a box to open up 30 years ago when they were first wed. Unfortunately, while the Executive Chief was away training for his new
  job, his wife began ill and she died those many years ago. The time is ready for him to open the box, and he asks you to go retrieve it for him in Degula Maze .
