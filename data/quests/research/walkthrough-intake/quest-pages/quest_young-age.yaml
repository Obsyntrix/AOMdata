reward_raw: Exp. Credit Gold 800 65 - Items -
walkthrough_raw: Step 1 Learn of the Executive Chief's great love by talking with him (301,171). Step 2 Go to Degula Maze Step 3 Dig up the Time Box (145,94 - it's by the tree in the
  courtyard in front of the Degula Duke's). Step 4 Return the Time Box back to the Executive Chief in Memory Cave .
