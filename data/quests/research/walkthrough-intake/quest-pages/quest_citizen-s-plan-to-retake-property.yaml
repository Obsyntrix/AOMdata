summary_raw: 'The Pirates have pillaged the people of Cherry Village. Cherry''s Leader asks for your help in taking back what is theirs. (Note: do this quest before the Asmode series.)'
information_raw: 'Quest Giver Repeatable Series Cherry''s Leader No No

  Previous Quest Next Quest - -'
requirements_raw: Faction Lvl Rank Skill Quest Aurora 22+ - - -
reward_raw: 'Exp. Credit Gold 1390 75 - Items Choose one of: Courage Talisman , Intelligence Talisman , Body Talisman , or Spell Talisman'
walkthrough_raw: Step 1 Talk to Cherry's Leader (235,73). Step 2 Go to Riprap coast . Step 3 Defeat Piratekin until you collect 3 keys, a copper, silver and gold key. (these will not
  appear in your invetory) Step 4 Go to the island to the far left of the map, and you will find a blue tresure chest (68,169) that is locked there.click on it to obtain a Bag of Pearls
  . Step 5 Go to Cherry Village . Step 6 Return the treasure to Cherry's Leader.
