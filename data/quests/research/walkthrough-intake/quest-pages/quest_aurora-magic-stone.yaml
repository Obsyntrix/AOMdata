walkthrough_raw: Step 1 Asmode (262,178) will give you a Magic stone. Step 2 Go to Cherry Village . Step 3 Find the statue of a monkey wearing a crown and holding an egg (30,31 - it's
  on the little island to the bottom left of the screen). Then place the stone against it. Step 4 You will be transported to Admode's Den.
