summary_raw: Karter believes his friend Bonny is a coward for not wanting to fight the pirates. But, Bonny had a plan he wished to propose to the Fish Labor Union. Unfortunately, it
  was lost. Maybe you can find Bonnie's Itemosal and show it to Karter to mend their friendship.
