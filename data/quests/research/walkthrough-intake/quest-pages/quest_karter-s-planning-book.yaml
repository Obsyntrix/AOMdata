walkthrough_raw: Step 1 You find a Proposal by clicking on the pile of books (189,36) by the pick-nic table in Riprap Coast . Step 2 Take the proposal to Sailor Bonny (257,111) in Dawn
  Harbor , he will give you the quest. Step 3 Then show the proposal to Sailor Karter (269,76) in Dawn Harbor .
