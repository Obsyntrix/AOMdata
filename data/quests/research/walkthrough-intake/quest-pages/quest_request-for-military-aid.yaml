walkthrough_raw: Step 1 Speak to the Fishing Leader (152,156) and ask about the Riprap Pirates . He will give you the Chairman's Letter . Step 2 Take the letter to Aurora City . Step
  3 Give it to the Deputy Colonel (103,85). Step 4 Go back to Dawn Harbor . Step 5 Tell the Fishing Leader that he won't be getting help yet, things must be approved by the King first.
