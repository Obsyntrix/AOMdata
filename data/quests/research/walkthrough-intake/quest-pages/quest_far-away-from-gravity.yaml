walkthrough_raw: 'Step 1 Talk to Gravity Boffin which will send you to talk with Fatz at Flaming Door , take the item and deliver it to Gravity Boffin. Step 2 You then require two elements:
  Hottest fire and ocean heart

  "These two elements can only be reached in the hottest district and the bottom of the Blue Ocean respectively. The former one can be got from the Monster in the fervent channel Underground,
  whilst the latter lies in the Quiet Ocean . But remember! Both will begin to fade away about 2 hours after leaving their resting places. " Step 3 Return elements to Gravity Boffin
  before time runs out for both elements. _

  Step 4 Return materials to Gravity Boffin Note: Level 61 refined materials, from productors.'
