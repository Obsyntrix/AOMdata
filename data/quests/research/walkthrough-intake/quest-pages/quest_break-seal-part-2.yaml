walkthrough_raw: 'Step 1 Speak with Sharker in Breeze Woods . Step 2 Go to Cryptic Moon Swamp . Step 3 Defeat Elves , Mud Crabs and Marsh Frogs until the Essence of Wind, Essence of
  Water and Essence of Sand is collected. (Essences in the same order as the monsters that drop them.)

  Step 4 Return to Breeze Woods and give the items to Sharker.'
