information_raw: 'Quest Giver Requirements Repeatable? Shiwand Beast Faction; Completed quest Sage''s Staff No

  Previous Quest Next Quest Break Seal -

  Summary Sharker assures you that he knows what he is doing, but he still needs ingredients to help with the ritual. Defeat Elves , Mud Crabs and Marsh Frogs to collect Essence of Wind,
  Essence of Water and Essence of Sand for the spell preparations.

  Reward 1500 Experience, 350 Credit Choose one of: Pink Piggy , Brown Piggy or Yellow Piggy'
requirements_raw: null
