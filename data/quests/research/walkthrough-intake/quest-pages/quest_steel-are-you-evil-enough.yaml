walkthrough_raw: 'Step 1 Speak with Asmode (285,22) in Burning Desert , he will ask you to prove yourself because he isn''t sure you''re a Gebuer. Step 2 Not sure what to do, you go
  to Cactus Plain and speak with the Spy Angel (59,138). Step 3 The Spy Angel tells you to go back to Burning Desert . Step 4 Speak to the Surgeon (175,142) and he will give you dog
  tags of fallen soldiers. (Note: You must already have completed the quest Collecting Serum to get the tags.) Step 5 Take the tags back to Asmode (285,22) in Burning Desert and hand
  them to him. He will give you a Magic Stone (which will not appear in your inventory).'
