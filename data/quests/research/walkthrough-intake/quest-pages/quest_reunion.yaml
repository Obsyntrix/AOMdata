  Previous Quest Next Quest Marlin‘s Bone -

  Summary Mistress Marlin asks you to take her bones to bury them next to Gaze. Go to the grave (61, 131) and place her bones there. Gaze will appear and you must defeat the Rage Elf
  boss. Once it is done, return to the house and open the trunk (188, 117) for your reward.

  Reward Exp +2300, Credit +550 Choose one of: Warrior Cuff , Shooter Gloves or Jade Gloves'
